<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision - Apartados</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        /* ── TARJETAS DE APARTADO ── */
        .apartados-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 14px;
        }

        .apartado-card {
            background: #fff;
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #ccc;
            transition: box-shadow .2s;
        }

        .apartado-card:hover {
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        .apartado-card.pendiente {
            border-left-color: #f59e0b;
        }

        .apartado-card.respondido {
            border-left-color: #3b82f6;
        }

        .apartado-card.parcial {
            border-left-color: #8b5cf6;
        }

        .apartado-card.completado {
            border-left-color: #10b981;
        }

        .apt-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .apt-proveedor {
            font-size: 1rem;
            font-weight: 800;
            color: #1a1a2e;
        }

        .apt-fecha {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
        }

        .badge-apt {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .badge-pendiente {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-respondido {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-parcial {
            background: #ede9fe;
            color: #5b21b6;
        }

        .badge-completado {
            background: #d1fae5;
            color: #065f46;
        }

        .apt-stats {
            display: flex;
            gap: 12px;
            font-size: 0.78rem;
            color: #555;
            margin-bottom: 12px;
        }

        .apt-stat strong {
            color: #1a1a2e;
        }

        .apt-acciones {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-apt {
            flex: 1;
            min-width: 80px;
            padding: 6px 10px;
            border: none;
            border-radius: 7px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .15s;
        }

        .btn-apt:hover {
            opacity: .8;
        }

        .btn-apt.ver {
            background: #e0e7ff;
            color: #3730a3;
        }

        .btn-apt.whatsapp {
            background: #dcfce7;
            color: #166534;
        }

        .btn-apt.recoger {
            background: #fef9c3;
            color: #854d0e;
        }

        /* ── FILTROS ── */
        .filtros-apt {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filtro-btn {
            padding: 6px 14px;
            border: 2px solid #e0e0f0;
            background: #fff;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            color: #555;
            transition: all .15s;
        }

        .filtro-btn.active,
        .filtro-btn:hover {
            border-color: #1a1a2e;
            background: #1a1a2e;
            color: #fff;
        }

        /* ── MODAL DETALLE APARTADO ── */
        .modal-apt .modal-content {
            max-width: 780px;
            max-height: 92vh;
            overflow-y: auto;
        }

        .detalle-apt-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            margin-bottom: 16px;
        }

        .detalle-apt-tabla th {
            background: #f0f0f8;
            padding: 8px 10px;
            text-align: left;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #555;
        }

        .detalle-apt-tabla td {
            padding: 9px 10px;
            border-bottom: 1px solid #f3f3f8;
            vertical-align: middle;
        }

        .detalle-apt-tabla tbody tr:hover {
            background: #fafafa;
        }

        .disponible-si {
            color: #1a6b3c;
            font-weight: 700;
        }

        .disponible-no {
            color: #842029;
            font-weight: 700;
        }

        .estado-recogido {
            color: #1a6b3c;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* Input cantidad recogida */
        .input-recogida {
            width: 70px;
            padding: 4px 7px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.82rem;
            text-align: center;
        }

        /* Foto evidencia */
        .foto-evidencia-thumb {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-foto {
            padding: 4px 8px;
            background: #f0f0f8;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.74rem;
            cursor: pointer;
            color: #3730a3;
            font-weight: 600;
        }

        .btn-foto:hover {
            background: #e0e0f8;
        }

        /* Sección recoger */
        .seccion-recoger {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 12px;
        }

        .seccion-recoger h4 {
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #92400e;
            margin: 0 0 12px 0;
        }
    </style>
</head>

<body>
    <button class="mobile-menu-toggle" id="mobileMenuToggle">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>👟 Vision</h2>
                <p id="userWelcome">Cargando...</p>
            </div>
            <nav class="sidebar-menu">
                <ul id="sidebarMenu"></ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div>
                    <h1>📦 Apartados a Proveedores</h1>
                    <p class="text-secondary">Seguimiento de productos solicitados y recogidas</p>
                </div>
            </header>

            <!-- Filtros rápidos -->
            <div class="filtros-apt">
                <button class="filtro-btn active" onclick="filtrarPor('', this)">Todos</button>
                <button class="filtro-btn" onclick="filtrarPor('pendiente', this)">⏳ Pendientes respuesta</button>
                <button class="filtro-btn" onclick="filtrarPor('respondido', this)">✅ Respondidos</button>
                <button class="filtro-btn" onclick="filtrarPor('parcial', this)">🔄 Recogida parcial</button>
                <button class="filtro-btn" onclick="filtrarPor('completado', this)">🏁 Completados</button>
            </div>

            <div class="apartados-grid" id="apartadosGrid">
                <p class="text-secondary">Cargando apartados...</p>
            </div>
        </main>
    </div>

    <!-- ═══════════════════════════════════════ -->
    <!-- MODAL: DETALLE + ACCIONES              -->
    <!-- ═══════════════════════════════════════ -->
    <div id="modalApartado" class="modal modal-apt">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalAptTitulo">Detalle del Apartado</h2>
                <button class="modal-close" id="btnCerrarApt">&times;</button>
            </div>
            <div id="contenidoApt" style="padding:var(--spacing-lg);">
                Cargando...
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/pages/apartados.js"></script>
    <script src="../js/sidebar.js"></script>
</body>

</html>
