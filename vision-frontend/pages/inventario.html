<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<button class="mobile-menu-toggle" id="mobileMenuToggle">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
            <div class="sidebar-header">
                <h2>👟 Vision</h2>
                <p id="userWelcome">Cargando...</p>
            </div>

            <nav class="sidebar-menu">
                <ul id="sidebarMenu">                   
                </ul>
            </nav>
        </aside>

    <!-- CONTENIDO -->
    <main class="main-content">

        <div class="content-header">
            <h1>Inventario</h1>
            <button class="btn-primary" id="btnNuevoAjuste">
                Ajuste manual
            </button>
        </div>

        <!-- TABLA INVENTARIO -->
        <div class="card">
            <div class="card-header">
                <h3>Stock actual</h3>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Talla</th>
                            <th>Cantidad</th>
                        </tr>
                    </thead>
                    <tbody id="tablaInventario">
                        <tr>
                            <td colspan="3" class="text-center text-secondary">
                                Cargando inventario...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<!-- MODAL AJUSTE -->
<div class="modal" id="modalAjuste">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Ajuste manual de inventario</h3>
            <button class="modal-close" id="cerrarModal">&times;</button>
        </div>

        <form id="formAjuste">

            <div class="form-group">
                <label>Tipo de ajuste</label>
                <select id="tipo">
                    <option value="entrada">Entrada</option>
                    <option value="salida">Salida</option>
                </select>
            </div>

            <div class="form-group">
                <label>Producto</label>
                <select id="producto"></select>
            </div>

            <div class="form-group">
                <label>Talla</label>
                <input type="number" id="talla" required>
            </div>

            <div class="form-group">
                <label>Cantidad</label>
                <input type="number" id="cantidad" required>
            </div>

            <div class="form-group">
                <label>Motivo</label>
                <input type="text" id="motivo" placeholder="Ej: ajuste físico">
            </div>

            <div class="form-group">
                <label>Observaciones</label>
                <textarea id="observaciones"></textarea>
            </div>

            <div class="flex flex-end">
                <button type="submit" class="btn-success">
                    Guardar ajuste
                </button>
            </div>

        </form>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/pages/inventario.js"></script>
<script src="../js/sidebar.js"></script>

</body>
</html>
